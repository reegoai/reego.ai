<!doctype html>
<html lang="{{ site.lang | slice: 0, 2 | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body class="{{ page.body_class }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  {% if jekyll.environment == "production" %}{% if site.google_tag_manager or site.google_analytics %}{% include cookie-notice.html %}{% endif %}{% endif %}
</body>
</html>
